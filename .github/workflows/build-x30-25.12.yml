name: Build TOTOLINK X30 OpenWrt latest release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/x30.config"
      - "patches/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "config/x30.config"
      - "patches/**"
      - "tests/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 3 * * 6"

permissions:
  contents: read

concurrency:
  group: x30-openwrt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  X30_PATCH_COMMIT: 1e4bed859aeb3c7047ee602866d833efed853e2d
  BUILD_JOBS: 2
  BUILD_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      skip_build: ${{ steps.prep.outputs.skip_build }}
      tag: ${{ steps.prep.outputs.tag }}
      openwrt_ref: ${{ steps.openwrt_release.outputs.openwrt_ref }}
      openwrt_version: ${{ steps.openwrt_release.outputs.openwrt_version }}
      upstream_sha: ${{ steps.prep.outputs.upstream_sha }}
      patch_id: ${{ steps.prep.outputs.patch_id }}
      config_hash: ${{ steps.prep.outputs.config_hash }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show builder repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f | sort

      - name: Validate builder inputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            config/x30.config
            patches/0001-mediatek-add-TOTOLINK-X30-support.patch
            patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch
            patches/0003-mediatek-filogic-correct-totolink-x30-hardware.patch
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "${file}" ]; then
              echo "ERROR: Required builder input is missing or empty: ${file}"
              exit 1
            fi
          done

          required_config_symbols=(
            CONFIG_TARGET_mediatek=y
            CONFIG_TARGET_mediatek_filogic=y
            CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30=y
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-ssl=y
            CONFIG_PACKAGE_kmod-tun=y
            CONFIG_PACKAGE_tailscale=y
            CONFIG_PACKAGE_ca-bundle=y
          )

          for symbol in "${required_config_symbols[@]}"; do
            if ! grep -Fxq "${symbol}" config/x30.config; then
              echo "ERROR: Required line is missing from config/x30.config: ${symbol}"
              exit 1
            fi
          done

          if grep -q 'compatible = "totolink,X30", "mediatek,mt7981";' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 still contains the broken uppercase Linux DTS compatible string."
            exit 1
          fi

          if ! grep -q 'compatible = "totolink,x30", "mediatek,mt7981";' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 does not contain the fixed lowercase Linux DTS compatible string."
            exit 1
          fi

          if ! grep -q 'SUPPORTED_DEVICES := totolink,X30 totolink,x30' patches/0001-mediatek-add-TOTOLINK-X30-support.patch; then
            echo "ERROR: Patch 0001 does not contain both legacy and fixed supported-device names."
            exit 1
          fi

          if ! grep -q 'totolink,X30' patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch; then
            echo "ERROR: Patch 0002 does not contain legacy uppercase board-name support."
            exit 1
          fi

          if ! grep -q 'totolink,x30' patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch; then
            echo "ERROR: Patch 0002 does not contain normalized lowercase board-name support."
            exit 1
          fi

      - name: Resolve latest OpenWrt release
        id: openwrt_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI is not available on this runner."
            exit 1
          fi

          OPENWRT_REF="$(gh api repos/openwrt/openwrt/releases/latest --jq '.tag_name')"

          if [ -z "${OPENWRT_REF}" ] || [ "${OPENWRT_REF}" = "null" ]; then
            echo "ERROR: Could not resolve latest OpenWrt release tag."
            exit 1
          fi

          if ! [[ "${OPENWRT_REF}" =~ ^v[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "ERROR: Unexpected OpenWrt release tag format: ${OPENWRT_REF}"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags https://github.com/openwrt/openwrt.git "refs/tags/${OPENWRT_REF}" >/dev/null 2>&1; then
            echo "ERROR: Latest release tag does not exist in openwrt/openwrt git refs: ${OPENWRT_REF}"
            exit 1
          fi

          OPENWRT_VERSION="${OPENWRT_REF#v}"

          echo "Latest OpenWrt release: ${OPENWRT_REF}"
          echo "OpenWrt version: ${OPENWRT_VERSION}"

          echo "openwrt_ref=${OPENWRT_REF}" >> "$GITHUB_OUTPUT"
          echo "openwrt_version=${OPENWRT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "OPENWRT_REF=${OPENWRT_REF}" >> "$GITHUB_ENV"
          echo "OPENWRT_VERSION=${OPENWRT_VERSION}" >> "$GITHUB_ENV"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl time jq

      - name: Clone OpenWrt release tag
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${OPENWRT_REF:-}" ]; then
            echo "ERROR: OPENWRT_REF was not set by the release resolver step."
            exit 1
          fi

          git clone \
            --branch "${OPENWRT_REF}" \
            --single-branch \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt
          echo "OpenWrt ref:"
          git describe --tags --exact-match || git branch --show-current
          echo "OpenWrt HEAD:"
          git log -1 --oneline

      - name: Prepare X30 source tree
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          cd openwrt
          git config user.name "x30-builder"
          git config user.email "x30-builder@example.invalid"

          required_openwrt_paths=(
            target/linux/mediatek/image/filogic.mk
            target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          )

          for path in "${required_openwrt_paths[@]}"; do
            if [ ! -f "${path}" ]; then
              echo "ERROR: Expected OpenWrt path is missing in ${OPENWRT_REF}: ${path}"
              echo "The latest release may have moved files that this builder patches."
              exit 1
            fi
          done

          UPSTREAM_SHA="$(git rev-parse --short=12 HEAD)"
          CONFIG_HASH="$(sha256sum \
            ../config/x30.config \
            ../patches/0001-mediatek-add-TOTOLINK-X30-support.patch \
            ../patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch \
            ../patches/0003-mediatek-filogic-correct-totolink-x30-hardware.patch \
            ../.github/workflows/build-x30-25.12.yml \
            ../tests/test-x30-fit-upgrade.sh \
            ../tests/test-x30-hardware.sh \
            ../tests/test-x30-device-tree.py \
            | sha256sum | cut -c1-12)"

          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "config_hash=${CONFIG_HASH}" >> "$GITHUB_OUTPUT"
          echo "openwrt_version=${OPENWRT_VERSION}" >> "$GITHUB_OUTPUT"

          if grep -q "Device/totolink_X30" target/linux/mediatek/image/filogic.mk; then
            echo "X30 image profile already exists in ${OPENWRT_REF}; not applying profile patch."
            PATCH_ID="official"
          else
            echo "Applying pinned X30 board-support patch: ${X30_PATCH_COMMIT}"
            git am --3way "../patches/0001-mediatek-add-TOTOLINK-X30-support.patch"
            PATCH_ID="${X30_PATCH_COMMIT:0:12}"
          fi

          echo "Applying X30 FIT sysupgrade platform patch"
          if grep -q "totolink,X30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh && \
             grep -q "totolink,x30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh; then
            echo "X30 FIT sysupgrade handler already exists; not applying local platform patch."
          else
            git apply --check "../patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch"
            git apply "../patches/0002-mediatek-filogic-add-totolink-x30-fit-upgrade.patch"
          fi

          echo "Applying verified stable X30 hardware corrections"
          git apply --check "../patches/0003-mediatek-filogic-correct-totolink-x30-hardware.patch"
          git apply "../patches/0003-mediatek-filogic-correct-totolink-x30-hardware.patch"
          sh ../tests/test-x30-fit-upgrade.sh "$PWD"
          sh ../tests/test-x30-hardware.sh "$PWD"

          echo "Verifying X30 image profile"
          grep -n "Device/totolink_X30" target/linux/mediatek/image/filogic.mk
          grep -n "TARGET_DEVICES += totolink_X30" target/linux/mediatek/image/filogic.mk
          grep -n "SUPPORTED_DEVICES := .*totolink,X30.*totolink,x30" target/linux/mediatek/image/filogic.mk

          echo "Verifying normalized X30 board name and rootdisk"
          grep -n 'compatible = "totolink,x30", "mediatek,mt7981";' target/linux/mediatek/dts/mt7981b-totolink-X30.dts
          grep -n 'rootdisk = <&ubi_rootdisk>;' target/linux/mediatek/dts/mt7981b-totolink-X30.dts
          grep -n 'volname = "fit";' target/linux/mediatek/dts/mt7981b-totolink-X30.dts

          echo "Verifying X30 FIT upgrade handlers"
          grep -n "totolink,X30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          grep -n "totolink,x30" target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh

          TAG="x30-${OPENWRT_VERSION}-${UPSTREAM_SHA}-${PATCH_ID}-${CONFIG_HASH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "patch_id=${PATCH_ID}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists. Nothing new to build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update feeds
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cp ../config/x30.config .config
          echo "Seed config:"
          cat .config

          make defconfig

          echo "Resolved important config lines:"
          grep -E 'CONFIG_TARGET_mediatek|CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_kmod-tun|CONFIG_PACKAGE_tailscale|CONFIG_PACKAGE_ca-bundle|CONFIG_BUILD_LOG' .config || true

          required_config_symbols=(
            CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30
            CONFIG_PACKAGE_kmod-tun
            CONFIG_PACKAGE_tailscale
            CONFIG_PACKAGE_ca-bundle
          )

          for symbol in "${required_config_symbols[@]}"; do
            if ! grep -q "^${symbol}=y" .config; then
              echo "ERROR: Required symbol ${symbol}=y was not selected after make defconfig."
              grep -Ei 'x30|totolink|tailscale|kmod-tun|ca-bundle|tun' .config || true
              exit 1
            fi
          done

          echo "OpenWrt diffconfig:"
          ./scripts/diffconfig.sh

          echo "OpenWrt make info entries matching x30/totolink:"
          make info | grep -Ei 'x30|totolink' || true

      - name: Download sources
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        if: steps.prep.outputs.skip_build != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          df -h

          if ! make -j"${BUILD_JOBS}" V=s 2>&1 | tee ../build.log; then
            echo "Parallel build failed. Retrying single-threaded to expose exact failing command..."
            make -j1 V=sc 2>&1 | tee ../build-single.log
            exit 1
          fi

          df -h

      - name: Validate the compiled hardware description
        if: steps.prep.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dtbs < <(find openwrt/build_dir -path '*/linux-mediatek_filogic/image-mt7981b-totolink-X30.dtb' -type f)
          test "${#dtbs[@]}" -eq 1
          python3 tests/test-x30-device-tree.py "${dtbs[0]}"

      - name: Collect artifacts
        if: steps.prep.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out
          cd openwrt
          TARGET_DIR="bin/targets/mediatek/filogic"

          echo "Full target directory contents:"
          find "${TARGET_DIR}" -maxdepth 2 -type f -printf '%p\n' | sort

          echo "Searching for X30/TOTOLINK firmware artifacts:"
          find "${TARGET_DIR}" -maxdepth 1 -type f \
            \( -iname '*x30*' -o -iname '*totolink*' \) \
            -printf '%p\n' | sort | tee ../x30-artifact-list.txt

          if [ ! -s ../x30-artifact-list.txt ]; then
            echo "ERROR: No X30/TOTOLINK firmware artifacts found."
            exit 1
          fi

          while IFS= read -r artifact; do
            cp -v "$artifact" ../out/
          done < ../x30-artifact-list.txt

          for meta in sha256sums config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            [ -f "${TARGET_DIR}/${meta}" ] && cp -v "${TARGET_DIR}/${meta}" "../out/${meta}"
          done

          ./scripts/diffconfig.sh > ../out/x30.diffconfig
          git rev-parse HEAD > ../out/openwrt-git-head.txt
          git log -1 --oneline > ../out/openwrt-git-log.txt
          cp ../x30-artifact-list.txt ../out/x30-artifact-list.txt

          jq -n \
            --arg builder_commit "$BUILD_SOURCE_HEAD" \
            --arg checkout_commit "$GITHUB_SHA" \
            --arg upstream_commit "$(git rev-parse "${OPENWRT_REF}^{commit}")" \
            --arg openwrt_ref "$OPENWRT_REF" \
            --arg hardware_patch_sha256 "$(sha256sum ../patches/0003-mediatek-filogic-correct-totolink-x30-hardware.patch | cut -d' ' -f1)" \
            '{builder_commit:$builder_commit, checkout_commit:$checkout_commit, upstream_commit:$upstream_commit, openwrt_ref:$openwrt_ref, hardware_patch_sha256:$hardware_patch_sha256}' \
            > ../out/x30-build-provenance.json

          cd ../out
          sha256sum * > BUILD-SHA256SUMS.txt
          ls -lh

          SYSUPGRADE_IMAGE="$(find . -maxdepth 1 -type f \( -iname '*x30*sysupgrade*.bin' -o -iname '*totolink*sysupgrade*.bin' \) | sort | head -n 1)"
          if [ -z "${SYSUPGRADE_IMAGE}" ]; then
            echo "ERROR: No X30/TOTOLINK sysupgrade image found."
            exit 1
          fi
          echo "Found sysupgrade image: ${SYSUPGRADE_IMAGE}"

          FWTOOL="$(find ../openwrt/staging_dir -path '*/bin/fwtool' -type f | sort | head -n 1)"
          if [ -z "${FWTOOL}" ] || [ ! -x "${FWTOOL}" ]; then
            echo "ERROR: Could not find host fwtool to validate sysupgrade metadata."
            exit 1
          fi

          "${FWTOOL}" -q -i x30-sysupgrade.meta.json "${SYSUPGRADE_IMAGE}"

          echo "Sysupgrade metadata:"
          cat x30-sysupgrade.meta.json

          jq -e '.supported_devices | index("totolink,X30")' x30-sysupgrade.meta.json >/dev/null
          jq -e '.supported_devices | index("totolink,x30")' x30-sysupgrade.meta.json >/dev/null

          X30_MANIFEST="$(find . -maxdepth 1 -type f \( -iname '*x30*.manifest' -o -iname '*totolink*.manifest' \) | sort | head -n 1)"
          if [ -z "${X30_MANIFEST}" ]; then
            echo "ERROR: No X30/TOTOLINK manifest found."
            exit 1
          fi
          echo "Found X30 manifest: ${X30_MANIFEST}"

          required_manifest_packages=(
            kmod-tun
            tailscale
            ca-bundle
            ip-bridge
            iperf3
            libiperf3
            libatomic1
          )

          for package in "${required_manifest_packages[@]}"; do
            if ! grep -Eq "^${package}( |$)" "${X30_MANIFEST}"; then
              echo "ERROR: Required package ${package} was not found in ${X30_MANIFEST}."
              echo "Manifest contents:"
              cat "${X30_MANIFEST}"
              exit 1
            fi
          done

          echo "Required manifest packages found:"
          grep -E '^(kmod-tun|tailscale|ca-bundle)( |$)' "${X30_MANIFEST}"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failed-build-diagnostics
          path: |
            build.log
            build-single.log
            x30-artifact-list.txt
            openwrt/target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
            openwrt/.git/rebase-apply/patch
            openwrt/.config
            openwrt/tmp/.config*
            openwrt/logs/**
            openwrt/bin/targets/mediatek/filogic/**
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload workflow artifact
        if: steps.prep.outputs.skip_build != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openwrt-totolink-x30-${{ steps.openwrt_release.outputs.openwrt_version }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openwrt-totolink-x30-${{ needs.build.outputs.openwrt_version }}
          path: out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILDER_SHA: ${{ github.sha }}
          TAG: ${{ needs.build.outputs.tag }}
          OPENWRT_REF: ${{ needs.build.outputs.openwrt_ref }}
          OPENWRT_VERSION: ${{ needs.build.outputs.openwrt_version }}
          UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
          PATCH_ID: ${{ needs.build.outputs.patch_id }}
          CONFIG_HASH: ${{ needs.build.outputs.config_hash }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${TAG}" out/* \
            --target "${BUILDER_SHA}" \
            --title "TOTOLINK X30 OpenWrt ${OPENWRT_VERSION} build ${TAG}" \
            --notes "Custom TOTOLINK X30 build from OpenWrt ${OPENWRT_REF}.

          Upstream OpenWrt release tag SHA: ${UPSTREAM_SHA}
          X30 patch: ${PATCH_ID}
          Build config/patch/workflow hash: ${CONFIG_HASH}
          Target: mediatek/filogic
          Device profile: totolink_X30

          This build includes:
          - TOTOLINK X30 board support
          - TOTOLINK X30 FIT sysupgrade platform handler
          - Legacy board-name compatibility for totolink,X30
          - Normalized board-name compatibility for totolink,x30
          - kmod-tun
          - tailscale
          - ca-bundle

          Routine upgrades should use only:
          openwrt-mediatek-filogic-totolink_X30-squashfs-sysupgrade.bin

          Do not flash preloader.bin or bl31-uboot.fip for routine upgrades."
